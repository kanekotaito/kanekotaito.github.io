name: KEIBA LAB smoke tests
on:
  push:
    paths:
      - "keiba-lab/**"
      - ".github/workflows/keiba-lab-test.yml"
  pull_request:
    paths:
      - "keiba-lab/**"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify app syntax
        run: |
          node --check keiba-lab/app.js
          node --check keiba-lab/feature-engine.js
      - name: Run smoke tests
        run: node keiba-lab/tests/smoke.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install -r keiba-lab/tools/requirements.txt
      - name: Verify Python parser syntax
        run: python -m py_compile keiba-lab/tools/netkeiba_import.py
      - name: Run offline HTML parser tests
        run: python -m unittest discover -s keiba-lab/tests -p test_netkeiba.py -v
