.feedback{border-top:1px solid var(--line);margin-top:25px;padding-top:22px}.verdict{font-weight:900;display:flex;align-items:center;gap:11px;font-size:19px}.verdict.good{color:var(--green)}.verdict.bad{color:var(--red)}.exlabel{font-size:11px;font-weight:900;color:#7e9195;margin:19px 0 8px}.explanation{font-size:15px;line-height:1.9;color:#34515a}.trap{background:var(--amber2);border-radius:12px;padding:13px 14px;margin-top:16px;border-left:4px solid #be8a36;line-height:1.7;font-size:13px;color:#765525}.trap b{display:block;font-size:12px;margin-bottom:4px}.source{margin-top:13px;font-size:11px;color:#829294}.controls{display:flex;gap:10px;margin-top:19px;align-items:center}.controls .btn.next{flex:1;font-size:15px;min-height:56px}.controls .btn.prev{min-height:56px}.note{font-size:12px;color:#70858c;line-height:1.7;margin:15px 3px}
.result{background:white;border:1px solid var(--line);border-radius:19px;padding:24px 19px;text-align:center}.result h2{font-size:22px;margin:6px 0}.score{font-size:61px;font-weight:900;letter-spacing:-.055em;margin:9px 0;font-variant-numeric:tabular-nums}.score small{font-size:17px;color:var(--muted);font-weight:700}.result .pass{font-weight:850;color:var(--green);font-size:16px}.result .fail{color:var(--red);font-weight:850;font-size:16px}.result p{font-size:13px;line-height:1.8;color:#657d83}.resultactions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:21px 0}.result .titleleft{text-align:left;margin:26px 0 9px;font-size:16px}.review-row{text-align:left;padding:13px 0;border-top:1px solid var(--line)}.review-row h4{font-size:14px;line-height:1.65;margin:6px 0}.review-row p{margin:4px 0;color:#4d666c;font-size:12px}.wrong-num{font-size:12px;color:#b04d3d;font-weight:850}.footer{margin-top:35px;font-size:11px;line-height:1.9;color:#7b8d90}.warning{border-radius:11px;padding:12px;background:var(--amber2);border:1px solid #e9d3a3;color:#806333;font-size:12px;line-height:1.7;margin:10px 0}.noscript{padding:12px;background:#ffe7e5;color:#962b2b;margin:14px;border-radius:8px}#errorBox{display:none}

(function(){'use strict';
var Q=[{"id":1,"q":"日本では、猟銃や空気銃の所持は原則自由であり、危険な用途に使用する場合だけ所持許可を要する。","a":"×","why":"銃砲の所持は原則禁止。公安委員会の許可などは、法律上の例外として認められる。","trap":"原則／例外","page":"2","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":2,"q":"知人の猟銃を、本人に頼まれて自宅で預かるだけなら、発射しない限り「所持」には当たらない。","a":"×","why":"「所持」には保管・携帯・運搬など、事実上支配することが含まれる。友人の承諾だけでは適法にならない。","trap":"所持の定義","page":"2","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":3,"q":"一人が複数丁の猟銃を所持するときは、原則として銃ごとに所持許可が必要である。","a":"○","why":"許可は人と銃の組合せごと。１丁を複数人で共同名義にして所持することもできない。","trap":"銃ごとの許可","page":"2","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":4,"q":"銃砲店で猟銃を購入する場合は、先に銃を受け取り、14日以内に所持許可を申請すればよい。","a":"×","why":"銃を譲り受ける前に所持許可が必要。「14日以内」は許可取得後、実際に譲り受けた銃について受ける確認の期限。","trap":"14日と許可前後","page":"3・6","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":5,"q":"猟銃の所持許可は、狩猟・有害鳥獣駆除・標的射撃のほか、収集鑑賞を目的としても受けられる。","a":"×","why":"収集・鑑賞や故人の遺品保管は、通常の猟銃・空気銃の所持許可の用途にならない。","trap":"用途の混同","page":"3","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":6,"q":"18歳になれば、原則として猟銃の所持許可を受けられる。","a":"×","why":"原則は猟銃20歳以上、空気銃18歳以上。例外はあるが、年齢の数字を逆にしない。","trap":"18歳／20歳","page":"4","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":7,"q":"初心者講習の講習修了証明書は、所持許可申請時に交付から１年以内でなければ使用できない。","a":"×","why":"講習修了証明書は、許可・更新時に交付後３年を経過していないことが必要。射撃教習修了証明書の「１年」と混同しやすい。","trap":"１年／３年","page":"5","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":8,"q":"射撃教習修了証明書は、猟銃の所持許可時に交付から１年を経過していないことが必要である。","a":"○","why":"射撃教習修了証明書・技能検定合格証明書は原則１年。講習修了証明書（３年）と区別する。","trap":"証明書の有効期間","page":"5","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":9,"q":"許可を受けた猟銃を譲り受けた人は、14日以内に銃と所持許可証を持参して警察の確認を受けなければならない。","a":"○","why":"先に許可証が交付され、譲受け後14日以内に確認を受ける。","trap":"14日の起算点","page":"6","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":10,"q":"猟銃の所持許可の有効期間は、許可を受けた日から一律ちょうど３年間である。","a":"×","why":"狩猟・有害鳥獣駆除・標的射撃用の所持許可は、許可日から３回目の誕生日が経過するまで。単純に許可日＋３年ではない。","trap":"３年／３回目の誕生日","page":"7","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":11,"q":"所持許可の通常の更新申請期間は、有効期間満了日の２か月前から１か月前までである。","a":"○","why":"「満了直前まで申請できる」が原則ではない。やむを得ない事情による特例とは分けて覚える。","trap":"申請期間","page":"8","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":12,"q":"所持許可を受けたにもかかわらず、その許可証に記載された銃を３か月以内に所持しなかったときは、原則としてその許可は失効する。","a":"○","why":"許可証の交付だけで無期限に銃の取得を先延ばしできない。","trap":"３か月","page":"10","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":13,"q":"猟銃の所持許可が失効したときは、原則として30日以内に再許可・譲渡・廃棄などの措置をとらなければならない。","a":"×","why":"所持許可失効後の措置は原則50日以内。30日・14日など別の期限が頻繁にひっかけに使われる。","trap":"30日／50日","page":"11","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":14,"q":"許可を受けた用途で猟銃を２年以上続けて使用していないと、所持許可を取り消されることがある。","a":"○","why":"いわゆる「眠り銃」は、令和７年３月施行の改正を踏まえ２年以上の継続不使用が取消事由になり得る。「必ず取消し」とはしていない。","trap":"２年／取消し得る","page":"12","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":15,"q":"猟銃を所持許可証に記載の用途で使う場合や修理に出す場合など、正当な理由がある場合には携帯・運搬できる。","a":"○","why":"許可証を持つだけでは無制限に運べない。用途・修理等の正当な理由が必要。","trap":"正当な理由","page":"12","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":16,"q":"所持許可証を携帯していれば、猟銃をケースに入れず裸のまま道路で運搬しても差し支えない。","a":"×","why":"携帯・運搬時は銃に覆いをかぶせるか容器に入れる必要がある。許可証の携帯とは別の遵守事項。","trap":"許可証と覆い","page":"13","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":17,"q":"狩猟期間中の猟場なら、獲物を探して移動している間も常に実包を装塡したままでよい。","a":"×","why":"狩猟中であっても、明らかに発射する必要のない時は装塡できない。移動時の脱包・機関部開放を徹底する。","trap":"猟場なら常時OK？","page":"13・33","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":18,"q":"銃を発射する前に必要な周囲の安全確認を怠れば、実際に人や物への被害が生じなくても違反となる。","a":"○","why":"危害防止のための注意義務違反は、実害が出ない場合でも成立し得る。","trap":"結果／行為","page":"13","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":19,"q":"狩猟のため猟銃を所持する者は、狩猟期間ごとに事前の射撃練習に努める必要がある。","a":"○","why":"技能の維持向上は努力義務。「練習しなければ即日許可失効」という意味ではない。","trap":"努力義務／義務","page":"13","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":20,"q":"銃は施錠したガンロッカーに入れてあれば、その鍵を家族に預けていても自ら保管しているといえる。","a":"×","why":"家族であっても鍵を自由に扱える状態にしてはいけない。鍵の管理は所持者本人が行う。","trap":"家族は例外？","page":"15・40","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":21,"q":"猟銃用実包の管理帳簿は、購入・譲渡の記録だけでなく、消費や廃棄についても記載する必要がある。","a":"○","why":"譲受・譲渡・製造・消費・廃棄などを記録する。令和７年３月の改正を踏まえ記載項目にも注意。","trap":"「購入だけ」の誤り","page":"17","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":22,"q":"猟銃用実包の管理帳簿は、最終記載日から２年間保存すればよい。","a":"×","why":"帳簿の保存期間は最終記載日から３年間。","trap":"２年／３年","page":"17","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":23,"q":"猟銃・空気銃の所持者は、通常１年に１回、銃・所持許可証等について警察の検査を受ける必要がある。","a":"○","why":"いわゆる銃検。帳簿なども検査の対象になる。","trap":"年１回","page":"20","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":24,"q":"狩猟者登録を受けていれば、鳥獣捕獲が禁止されている場所でも、狩猟期間中は自由に銃猟ができる。","a":"×","why":"狩猟者登録は捕獲禁止場所などの規制を解除しない。鳥獣保護管理法違反の発射は銃刀法上も問題になる。","trap":"登録／場所の規制","page":"25","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":25,"q":"実包と空包は、合計800個以内であれば、必要な条件を満たす堅固で施錠できる設備で自宅に保管できる。","a":"○","why":"警察庁の例題に示される基準。ただし数量以外にも、適法な所持・安全な貯蔵など各種条件が必要。","trap":"800個と設備","page":"24","topic":"基本・重要","kind":"法令","source":"警察庁 例題の該当項目"},{"id":26,"q":"空気銃は火薬の燃焼ガスで弾丸を発射する銃である。","a":"×","why":"空気銃は圧縮空気・圧縮ガスの力を利用する。火薬の燃焼ガスを使用する猟銃とは区別する。","trap":"動力源","page":"27","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":27,"q":"自動装塡式の猟銃では、発射時に生じるガス圧や反動を利用して排きょう・次弾装塡を行う。","a":"○","why":"「自動装塡」と「自動発射」は別。ここでは排きょう・装塡が自動になる機構のこと。","trap":"自動装塡／自動発射","page":"27","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":28,"q":"猟銃の撃針は、雷管を打撃して起爆させる役割をもつ。","a":"○","why":"撃鉄からの打撃を受けて雷管を打つのが撃針。撃鉄・撃針・引き金を混同しない。","trap":"部品名","page":"28","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":29,"q":"猟銃の安全装置を作動させておけば、銃を落としたり強い衝撃を与えたりしても、暴発する危険はない。","a":"×","why":"安全装置は衝撃による暴発を確実に防ぐ仕組みではない。常に装塡確認・銃口管理が必要。","trap":"安全装置への過信","page":"30","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":30,"q":"猟銃の引き金は軽く調整した方が、わずかな衝撃では作動しにくくなり安全である。","a":"×","why":"軽すぎる引き金は衝撃等で暴発しやすくなる。射撃用・狩猟用の目安も異なる。","trap":"軽い／重い","page":"29","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":31,"q":"猟銃の薬室が完全に閉じていなくても、安全装置を掛けていれば発射して差し支えない。","a":"×","why":"薬室の閉鎖不完全は燃焼ガス噴出など重大な事故を招く。発射前に閉鎖状態を確認する。","trap":"安全装置で代替不可","page":"30","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":32,"q":"散弾銃の12番は、20番よりも銃口の内径が小さい。","a":"×","why":"一般に12番径の方が20番径より口径が大きい。番径の数値は直径を直接表すものではない。","trap":"番径の大小","page":"31","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":33,"q":"ライフル銃の弾丸には、最大到達距離が約4,000メートルに及ぶものもある。","a":"○","why":"有効射程よりはるか遠くまで到達し得る。撃つ前にその範囲の安全を考える。","trap":"有効射程／最大到達距離","page":"32","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":34,"q":"散弾銃の散弾の最大到達距離は、散弾の号数に関係なく、銃身の長さだけで決まる。","a":"×","why":"警察庁の例題は、散弾の最大到達距離は主として使用される散弾の号数によるとする。","trap":"散弾の号数","page":"32","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":35,"q":"射撃時の安全確認は、弾丸が正確に当たる「有効射程」の範囲だけ行えば十分である。","a":"×","why":"危険範囲は最大到達距離まで及ぶ。必要に応じバックストップも確認する。","trap":"有効／最大","page":"32","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":36,"q":"薬室に実包が入っていないと確認できれば、たとえ一時的でも銃口を人に向けてよい。","a":"×","why":"空銃と確認しても銃口を人へ向けない。銃口管理は装塡の有無と無関係。","trap":"装塡していなければOK？","page":"33","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":37,"q":"銃を持って移動するときや銃を手から離すときは、機関部を開放するとともに脱包する。","a":"○","why":"銃を手にした時などにも装塡の有無を確認する。","trap":"移動時・離す時","page":"33","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":38,"q":"獲物が近くにいる気配を感じたら、姿を確認する前でも引き金に指を掛けて待機してよい。","a":"×","why":"用心金の中に指を入れるのは獲物を確実に確認できた場合など発射準備時に限る。","trap":"気配／確認","page":"33","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":39,"q":"射撃場では、射台に立った時点で、射撃開始の合図がなくても実包を装塡できる。","a":"×","why":"射台に立ち、かつ発射してよい合図を受けた後など発射準備ができたときに限る。","trap":"射台／合図","page":"33","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":40,"q":"獲物かどうか少しでも確信が持てない場合は、狩猟中であっても発射してはならない。","a":"○","why":"音や動きだけで撃たない。対象の確実な識別は絶対条件。","trap":"確実な識別","page":"35","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":41,"q":"撃とうとする方向に道路や人家があっても、肉眼で人が見えなければ発射してよい。","a":"×","why":"道路・人家がある方向への発射は危険。見えない場所の人まで想定し、矢先の安全を確かめる。","trap":"見えない＝いない？","page":"35","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":42,"q":"有害鳥獣駆除では、捕獲の必要性が高い場合でも事故防止を優先する。","a":"○","why":"駆除の公益性があっても、銃による事故防止を優先する。","trap":"捕獲／安全の優先","page":"36","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":43,"q":"発射前には、獲物のいる地点だけでなく、散弾の散布範囲や弾丸の最大到達距離を含めて安全を考える。","a":"○","why":"散弾は獲物に当たらないものが広く飛ぶ。矢先・背後・周辺の安全を確認する。","trap":"標的／周辺","page":"36","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":44,"q":"水面や石垣に向けた射撃では、跳弾が生じる場合があるので注意が必要である。","a":"○","why":"跳弾は飛ぶ方向を予測しにくい。水面なら安全、という考えは誤り。","trap":"跳弾","page":"36","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":45,"q":"猟銃に実包を装塡するときは、射撃の状況に応じ、必要最小限の個数にとどめる。","a":"○","why":"連発可能な銃でも、常に最大数を装塡する考え方は不適切。","trap":"可能数／必要数","page":"34","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":46,"q":"銃腔内に雪や木の葉が入っていても、発射時の圧力で外へ出るため、そのまま射撃できる。","a":"×","why":"銃腔内の異物は銃身破裂など重大な事故の原因。使用前に銃腔を確認する。","trap":"異物は飛ぶ？","page":"38","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":47,"q":"猟銃の安全装置を点検するときは、まず実包が装塡されていないことを確認する。","a":"○","why":"機構の点検時ほど脱包の確認を優先する。","trap":"点検の順序","page":"39","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":48,"q":"猟銃だけでなく空気銃も、基準に適合する施錠可能な設備に適切に保管する必要がある。","a":"○","why":"空気銃だから自由な置き場所でよいわけではない。ガンロッカー等の基準を満たす設備が必要。","trap":"猟銃／空気銃","page":"40","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":49,"q":"射撃場で昼食をとる短時間なら、猟銃を施錠した自動車のトランクに置き、車から離れてもよい。","a":"×","why":"自動車のトランクは銃を保管する専用設備ではない。射撃場の保管設備など適切な管理が必要。","trap":"短時間／保管","page":"41","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":50,"q":"猟銃を運搬するときは、実包を同じケース内に入れておけば、別のバッグより紛失しにくいため望ましい。","a":"×","why":"銃と実包は同一ケースに入れて運搬してはならない。","trap":"銃／実包の分離","page":"42","topic":"安全・重要","kind":"取扱い","source":"警察庁 例題の該当項目"},{"id":51,"q":"猟銃の所持許可申請は、原則として住所地を管轄する警察署を通じて行う。","a":"○","why":"申請窓口の基本は申請者の住所地を管轄する警察署。購入先の所在地ではない。","trap":"住所地／購入先","page":"3","topic":"申請先","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":52,"q":"猟銃の所持許可は、銃砲店のある地域の警察署へ申請すればよい。","a":"×","why":"申請窓口の基本は申請者の住所地を管轄する警察署。購入先の所在地ではない。","trap":"住所地／購入先","page":"3","topic":"申請先","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":53,"q":"猟銃１丁について、２人が共同で同じ所持許可を受けることは認められない。","a":"○","why":"猟銃の許可は銃ごと・個人ごとであり、家族にも共同許可の例外はない。","trap":"家族でも共同不可","page":"3","topic":"共同所持","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":54,"q":"家族同士なら、１丁の猟銃を共同名義で許可してもらえる。","a":"×","why":"猟銃の許可は銃ごと・個人ごとであり、家族にも共同許可の例外はない。","trap":"家族でも共同不可","page":"3","topic":"共同所持","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":55,"q":"猟銃の所持許可が下りるまでは、購入契約済みでも銃を受け取ってはいけない。","a":"○","why":"許可を受ける前に譲り受けると不法所持になり得る。申請中と許可済みは別。","trap":"申請中／許可済み","page":"3","topic":"申請と取得","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":56,"q":"所持許可を申請済みなら、審査中に銃砲店から猟銃を先に引き取ってよい。","a":"×","why":"許可を受ける前に譲り受けると不法所持になり得る。申請中と許可済みは別。","trap":"申請中／許可済み","page":"3","topic":"申請と取得","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":57,"q":"猟銃の所持が許される主な用途には、狩猟・有害鳥獣駆除・標的射撃がある。","a":"○","why":"通常の猟銃・空気銃の所持許可は所定の用途が前提。鑑賞目的は含まれない。","trap":"実用目的／鑑賞","page":"3","topic":"目的","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":58,"q":"猟銃を自宅の装飾品として飾る目的でも通常の所持許可を受けられる。","a":"×","why":"通常の猟銃・空気銃の所持許可は所定の用途が前提。鑑賞目的は含まれない。","trap":"実用目的／鑑賞","page":"3","topic":"目的","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":59,"q":"家族が亡くなって残された銃であっても、遺品として自由に所持し続けることはできない。","a":"○","why":"相続・遺品という事情だけでは銃の所持は正当化されない。所定の措置が必要。","trap":"相続≠所持許可","page":"3","topic":"遺品","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":60,"q":"亡くなった親の猟銃は、相続人が希望すれば許可なく保管できる。","a":"×","why":"相続・遺品という事情だけでは銃の所持は正当化されない。所定の措置が必要。","trap":"相続≠所持許可","page":"3","topic":"遺品","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":61,"q":"公安委員会は、申請者に一定の欠格事由があるときは所持を許可しない。","a":"○","why":"考査の合格と公安委員会の所持許可審査は別。欠格事由等の審査がある。","trap":"講習合格≠許可","page":"4","topic":"本人の適格性","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":62,"q":"猟銃は筆記考査に合格すれば、申請者の事情にかかわらず所持を許可される。","a":"×","why":"考査の合格と公安委員会の所持許可審査は別。欠格事由等の審査がある。","trap":"講習合格≠許可","page":"4","topic":"本人の適格性","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":63,"q":"猟銃の所持許可には、原則として20歳以上という年齢要件がある。","a":"○","why":"通常の年齢要件は猟銃20歳、空気銃18歳。制度上の例外はある。","trap":"猟銃20／空気銃18","page":"4","topic":"年齢（猟銃）","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":64,"q":"原則として18歳になれば、空気銃だけでなく散弾銃の所持許可も受けられる。","a":"×","why":"通常の年齢要件は猟銃20歳、空気銃18歳。制度上の例外はある。","trap":"猟銃20／空気銃18","page":"4","topic":"年齢（猟銃）","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":65,"q":"空気銃の所持許可は、原則として18歳以上が年齢要件である。","a":"○","why":"空気銃の原則年齢は18歳。猟銃の原則20歳と混同しない。","trap":"20歳は猟銃","page":"4","topic":"年齢（空気銃）","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":66,"q":"空気銃でも猟銃と同様、例外なく20歳以上でなければ所持できない。","a":"×","why":"空気銃の原則年齢は18歳。猟銃の原則20歳と混同しない。","trap":"20歳は猟銃","page":"4","topic":"年齢（空気銃）","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":67,"q":"所持許可を申請する日に75歳以上の者は、所定の認知機能検査を受ける必要がある。","a":"○","why":"警察庁の例題では「申請日現在75歳以上」。数字を70歳に変えたひっかけ。","trap":"70／75","page":"6","topic":"高齢者","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":68,"q":"認知機能検査が必要なのは、所持許可を申請する日に70歳以上の人である。","a":"×","why":"警察庁の例題では「申請日現在75歳以上」。数字を70歳に変えたひっかけ。","trap":"70／75","page":"6","topic":"高齢者","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":69,"q":"所持許可申請で事実に反することを書くと、許可を受けられないことがある。","a":"○","why":"虚偽の記載や重要な事実を隠すことは許可審査上の問題。","trap":"虚偽記載／合格","page":"6","topic":"申請書の真実性","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":70,"q":"所持許可申請書に事実と違う内容を書いても、講習に合格していれば問題ない。","a":"×","why":"虚偽の記載や重要な事実を隠すことは許可審査上の問題。","trap":"虚偽記載／合格","page":"6","topic":"申請書の真実性","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":71,"q":"弾倉に３発以上の実包を装塡できる構造の散弾銃は、通常の所持許可の対象にならない。","a":"○","why":"警察庁例題にある構造・機能要件。弾倉の装塡数に注意。","trap":"３発以上","page":"6","topic":"銃の構造","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":72,"q":"散弾銃の弾倉に３発入る構造であっても、発射できれば許可される。","a":"×","why":"警察庁例題にある構造・機能要件。弾倉の装塡数に注意。","trap":"３発以上","page":"6","topic":"銃の構造","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":73,"q":"消音装置が装着された銃は、所持許可の対象にならない。","a":"○","why":"許可される銃の構造には条件がある。用途が狩猟だから例外とはならない。","trap":"狩猟用でも不可","page":"6","topic":"装置の制限","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":74,"q":"猟銃に消音装置が付いていても、狩猟用なら所持許可を受けられる。","a":"×","why":"許可される銃の構造には条件がある。用途が狩猟だから例外とはならない。","trap":"狩猟用でも不可","page":"6","topic":"装置の制限","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":75,"q":"初めて猟銃等の所持許可を得ようとする者は、所定の初心者講習を修了する必要がある。","a":"○","why":"狩猟免許と銃刀法の初心者講習は別制度。狩猟免許だけでは免除されない。","trap":"狩猟免許≠初心者講習","page":"6","topic":"初心者講習","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":76,"q":"初めて銃を持つ場合でも、狩猟免許があれば初心者講習は省略できる。","a":"×","why":"狩猟免許と銃刀法の初心者講習は別制度。狩猟免許だけでは免除されない。","trap":"狩猟免許≠初心者講習","page":"6","topic":"初心者講習","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":77,"q":"講習修了証明書は、所持許可申請時等に交付から３年を経過していないことが必要である。","a":"○","why":"講習修了証明書は３年、教習修了証明書・技能検定合格証明書は１年。","trap":"講習３年／教習１年","page":"6","topic":"証明書の有効期間","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":78,"q":"初心者講習の修了証明書は、所持許可申請時に交付から１年未満でなければ無効になる。","a":"×","why":"講習修了証明書は３年、教習修了証明書・技能検定合格証明書は１年。","trap":"講習３年／教習１年","page":"6","topic":"証明書の有効期間","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":79,"q":"教習修了証明書・技能検定合格証明書は、所持許可時に交付から１年を経過していないことが必要である。","a":"○","why":"射撃教習・技能検定と初心者講習では証明書の期間が違う。","trap":"教習１年／講習３年","page":"6","topic":"教習の証明","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":80,"q":"射撃教習修了証明書も初心者講習修了証明書も、ともに３年間使用できる。","a":"×","why":"射撃教習・技能検定と初心者講習では証明書の期間が違う。","trap":"教習１年／講習３年","page":"6","topic":"教習の証明","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":81,"q":"同種類の猟銃を複数所持する人は、所定の技能講習にそのうち１丁を使用できる。","a":"○","why":"技能講習は所定の種類ごとに扱われる。１丁ごとに必ず別々の講習ではない。","trap":"銃ごと／種類ごと","page":"9","topic":"複数銃の技能","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":82,"q":"同種類の猟銃を３丁持つ人は、技能講習も銃ごとに３回受ける必要がある。","a":"×","why":"技能講習は所定の種類ごとに扱われる。１丁ごとに必ず別々の講習ではない。","trap":"銃ごと／種類ごと","page":"9","topic":"複数銃の技能","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":83,"q":"更新申請は、原則として有効期間満了日の２か月前から１か月前までに行う。","a":"○","why":"原則の申請期間は満了日２か月前から１か月前まで。直前ならいつでもよいわけではない。","trap":"２か月前～１か月前","page":"9","topic":"更新期限","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":84,"q":"所持許可の更新は、有効期間が満了する前日までに申請すれば通常の申請期間内である。","a":"×","why":"原則の申請期間は満了日２か月前から１か月前まで。直前ならいつでもよいわけではない。","trap":"２か月前～１か月前","page":"9","topic":"更新期限","kind":"法令","source":"警察庁 令和7年11月28日別添3"},{"id":85 var STORE='ryoju200-v3';
var app=document.getElementById('app');
var DB={version:3,seen:{},miss:{},session:null,history:[]};
var memOK=true,clock=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
function save(){try{localStorage.setItem(STORE,JSON.stringify(DB));memOK=true;}catch(e){memOK=false;}}
function load(){try{var d=JSON.parse(localStorage.getItem(STORE)||'null');if(d&&d.version===3&&d.seen&&d.miss){DB=d;memOK=true;}}catch(e){memOK=false;} if(!DB.history)DB.history=[];}
function mix(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),temp=a[i];a[i]=a[j];a[j]=temp;}return a;}
function idToQ(id){return Q[Number(id)-1];}
function getIDs(kind){return Q.filter(function(q){return kind==='法令'?q.kind==='法令':kind==='取扱い'?q.kind==='取扱い':true;}).map(function(q){return q.id;});}
function remaining(s){return Math.max(0,3600-Math.floor((Date.now()-s.started)/1000));}
function mmss(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function countKeys(o){return Object.keys(o||{}).length;}
function sessionSummary(s){return s.mode==='exam'?'本番模試 50問':s.mode==='review'?'間違い復習':s.kind==='法令'?'法令だけ':s.kind==='取扱い'?'取扱いだけ':s.order.length===200?'200問 全問挑戦':'10問トレーニング';}
function notice(){return memOK?'':'<div class="warning">このブラウザーでは学習記録を保存できません。解答中は画面を閉じないでください。</div>';}
function finishSession(timeUp){var s=DB.session;if(!s||s.finished)return;s.finished=true;s.timeUp=!!timeUp;s.finishedAt=Date.now();var ids=s.order;var correct=0;ids.forEach(function(id){if(s.answers[id]===idToQ(id).a)correct++;});DB.history.unshift({date:Date.now(),mode:s.mode,total:ids.length,correct:correct});DB.history=DB.history.slice(0,20);save();render();}
function start(mode,kind){var ids=[];if(mode==='review'){ids=Object.keys(DB.miss).map(Number).filter(function(id){return idToQ(id);});}else if(mode==='exam'){ids=mix(getIDs('法令')).slice(0,25).concat(mix(getIDs('取扱い')).slice(0,25));}else if(mode==='full'){ids=getIDs('all');}else if(mode==='category'){ids=getIDs(kind);}else{ids=mix(getIDs('all')).slice(0,10);} if(!ids.length){render();return;}ids=mix(ids);DB.session={mode:mode,kind:kind||'全範囲',order:ids,index:0,answers:{},started:Date.now(),finished:false,timeUp:false};save();render();window.scrollTo(0,0);}
function answer(v){var s=DB.session;if(!s||s.finished)return;var id=s.order[s.index];if(s.mode!=='exam'&&s.answers[id])return;s.answers[id]=v;DB.seen[id]=(DB.seen[id]||0)+1;if(s.mode!=='exam'){if(v!==idToQ(id).a){DB.miss[id]=true;}else if(s.mode==='review'){delete DB.miss[id];}}save();render();if(s.mode!=='exam'){window.requestAnimationFrame(function(){var f=app.querySelector('.feedback');if(f)f.scrollIntoView({behavior:'auto',block:'nearest'});});}}
function move(delta){var s=DB.session;if(!s||s.finished)return;var id=s.order[s.index];if(delta>0&&s.mode!=='exam'&&!s.answers[id])return;var n=s.index+delta;if(n<0||n>=s.order.length){if(n>=s.order.length)finishWithConfirm();return;}s.index=n;save();render();window.scrollTo(0,0);}
function finishWithConfirm(){var s=DB.session;if(!s||s.finished)return;var missing=s.order.filter(function(id){return !s.answers[id];}).length;if(missing&&s.mode==='exam'&&!window.confirm('未解答が'+missing+'問あります。採点しますか？'))return;finishSession(false);window.scrollTo(0,0);}
function home(){var s=DB.session;if(s&&!s.finished){if(!window.confirm('現在の解答を中断してトップへ戻りますか？ 続きから再開できます。'))return;}renderHome();window.scrollTo(0,0);}
function resetAndStart(mode,kind){var s=DB.session;if(s&&!s.finished&&countKeys(s.answers)&&!window.confirm('進行中のセッションを新しく開始しますか？ 現在の進捗は上書きされます。'))return;start(mode,kind);}
function renderHome(){var s=DB.session;var done=countKeys(DB.seen),miss=countKeys(DB.miss);var resume=s&&!s.finished;var best=DB.history.filter(function(h){return h.mode==='exam'&&h.total===50;}).map(function(h){return h.correct;});
app.innerHTML=notice()+(resume?'<div class="continue"><div>📌 <b>学習の続き</b><p>'+esc(sessionSummary(s))+'：'+countKeys(s.answers)+' / '+s.order.length+'問</p></div><button class="btn" data-act="resume">再開する →</button></div>':'')+
'<div class="hero"><div class="herotitle"><h2>今日も一問ずつ、確実に。</h2><span class="pill">全200問</span></div><p class="desc">警察庁の公開例題を参考にした独自の○×問題。解説で「どの言葉が変わったか」まで確認できます。</p><div class="dash"><div class="metric"><div class="label">学習済み</div><strong>'+done+'<em> / 200</em></strong></div><div class="metric"><div class="label">復習待ち</div><strong>'+miss+'<em> 問</em></strong></div><div class="metric"><div class="label">模試最高</div><strong>'+(best.length?Math.max.apply(null,best):'―')+'<em>'+(best.length?' / 50':'')+'</em></strong></div></div></div>'+

'<section class="sections"><h3>分野別にじっくり</h3><div class="smallmodes"><button data-act="start" data-mode="category" data-kind="法令">⚖️ 法令 101問</button><button data-act="start" data-mode="category" data-kind="取扱い">🛡️ 取扱い・安全 99問</button></div></section>'+

function renderQuiz(){var s=DB.session,id=s.order[s.index],q=idToQ(id),v=s.answers[id],shown=(s.mode!=='exam'&&!!v),done=countKeys(s.answers),n=s.order.length,sec=s.mode==='exam'?remaining(s):null;
var box='<div class="topline"><button class="backbtn" data-act="home">← トップへ</button>'+(s.mode==='exam'?'<div id="countdown" class="timer '+(sec<300?'urgent':'')+'">⏱ '+mmss(sec)+'</div>':'<div class="timer">'+esc(sessionSummary(s))+'</div>')+'</div>';
box+='<div class="progress-head"><span>第 '+(s.index+1)+' 問 / '+n+' 問</span><span>回答済み '+done+'問</span></div><div class="meter"><span style="width:'+(100*done/n)+'%"></span></div>';
box+='<article class="quizcard"><div class="qbody"><div class="qbadge"><span>'+esc(q.kind)+'　/　'+esc(q.topic)+'</span><b>問題ID '+q.id+'</b></div><div class="question">'+esc(q.q)+'</div><div class="hintline">正しい文章は「○」、誤っている文章は「×」</div><div class="answers">';
['○','×'].forEach(function(c){var klass=v===c?' selected':'';if(shown&&v===c&&v!==q.a)klass=' wrong';if(shown&&c===q.a)klass=' right';box+='<button type="button" '+(shown?'disabled ':'')+'data-act="answer" data-value="'+c+'" class="'+klass+'" aria-label="'+c+'を選ぶ" aria-pressed="'+(v===c)+'">'+c+'<small>'+(c==='○'?'正しい':'誤り')+'</small></button>';});box+='</div>';
if(shown){var ok=(v===q.a);box+='<section class="feedback" aria-live="polite"><div class="verdict '+(ok?'good':'bad')+'">'+(ok?'✓ 正解！':'✕ 不正解　正解は '+q.a)+'</div><div class="exlabel">解説</div><div class="explanation">'+esc(q.why)+'</div><div class="trap"><b>⚠ ひっかけポイント</b>'+esc(q.trap)+'</div><div class="source">参照：警察庁（令和7年11月28日）別添3、例題 p.'+esc(q.page)+'</div></section>';}
var atEnd=s.index===n-1;box+='<div class="controls">'+(s.mode==='exam'&&s.index>0?'<button class="btn prev ghost" data-act="prev">← 戻る</button>':'')+'<button class="btn next" data-act="'+(atEnd?'finish':'next')+'" '+(s.mode!=='exam'&&!v?'disabled':'')+'>'+(atEnd?'採点結果を見る →':'次の問題へ →')+'</button></div>';
if(s.mode==='exam')box+='<div class="note">模試中は正解を表示しません。前の問題に戻って解答を変更できます。途中再開しても制限時間は進みます。</div>';else box+='<div class="note">回答直後に解説が表示されます。復習モードで正解すると、復習待ちリストから外れます。</div>';
box+='</div></article>'+footer();app.innerHTML=box;}
function renderResult(){var s=DB.session,correct=0,wrong=[];s.order.forEach(function(id){var q=idToQ(id),v=s.answers[id];if(v===q.a){correct++;}else{wrong.push({q:q,v:v||'未回答'});DB.miss[id]=true;}});save();var total=s.order.length,rate=Math.round(100*correct/total),full=s.mode==='exam',pass=full&&correct>=45;
var out='<div class="topline"><button class="backbtn" data-act="home">← トップへ</button><span class="pill">学習結果</span></div><section class="result"><div style="font-size:40px;margin-bottom:7px">'+(pass?'🏅':wrong.length?'📖':'🌟')+'</div><h2>'+(full?'本番模試の結果':'学習おつかれさま！')+'</h2><div class="score">'+correct+'<small> / '+total+'問</small></div>'+(full?'<div class="'+(pass?'pass':'fail')+'">'+(pass?'合格ライン到達！':'合格まであと'+(45-correct)+'問')+'</div>':'<div class="pass">正答率 '+rate+'%</div>')+'<p>'+(s.timeUp?'60分が経過したため自動採点しました。<br>':'')+'正答率 '+rate+'%　/　不正解・未回答 '+wrong.length+'問</p><div class="resultactions"><button class="btn" data-act="home">メニューに戻る</button><button class="btn outline" data-act="start" data-mode="review" '+(countKeys(DB.miss)?'':'disabled')+'>間違いを復習</button></div><h3 class="titleleft">'+(wrong.length?'間違えた問題と解説（'+wrong.length+'問）':'全問正解です！')+'</h3>';
wrong.forEach(function(row){out+='<div class="review-row"><div class="wrong-num">ID '+row.q.id+' ｜ あなた '+esc(row.v)+' ｜ 正解 '+row.q.a+'</div><h4>'+esc(row.q.q)+'</h4><p><b>解説：</b>'+esc(row.q.why)+'</p><p><b>ひっかけ：</b>'+esc(row.q.trap)+'</p></div>';});out+='</section>'+footer();app.innerHTML=out;}
function footer(){return '<footer class="footer">参考：警察庁「<a href="https://www.npa.go.jp/laws/notification/seian/hoan/hoantsutatu2/R071128_jyu_kousanojishi.pdf" rel="noopener noreferrer" target="_blank">猟銃等又はクロスボウ講習会における考査の運用要領</a>」（令和7年11月28日）、別添1・別添3。本アプリは警察庁の公式アプリではありません。問題文・解説は自主学習用の独自編集です。インターネット接続不要。<br>記録は使用中のブラウザー内にのみ保存されます。'+(memOK?'':'<b>この環境では記録の永続保存は利用できません。</b>')+'</footer>';}
function render(){var s=DB.session;if(s&&!s.finished&&s.mode==='exam'&&remaining(s)<=0){finishSession(true);return;}if(!s){renderHome();return;}if(s.finished){renderResult();return;}renderQuiz();}
app.addEventListener('click',function(e){var b=e.target.closest('button[data-act]');if(!b||b.disabled)return;var action=b.getAttribute('data-act');if(action==='start'){resetAndStart(b.getAttribute('data-mode'),b.getAttribute('data-kind'));return;}if(action==='home'){home();return;}if(action==='resume'){render();return;}if(action==='answer'){answer(b.getAttribute('data-value'));return;}if(action==='next'){move(1);return;}if(action==='prev'){move(-1);return;}if(action==='finish'){finishWithConfirm();return;}});
load();if(DB.session&&DB.session.finished){DB.session=null;save();}renderHome();
clock=setInterval(function(){var s=DB.session;if(!s||s.finished||s.mode!=='exam')return;if(remaining(s)<=0){finishSession(true);return;}var t=document.getElementById('countdown');if(t){t.textContent='⏱ '+mmss(remaining(s));t.classList.toggle('urgent',remaining(s)<300);}},1000);
window.addEventListener('visibilitychange',function(){if(!document.hidden&&DB.session&&!DB.session.finished&&DB.session.mode==='exam')render();});
})();
</script></body></html>
