var Q=[{"id":1,"q":"猟銃の所持許可を受けた人は、銃の所有権を持っているため、使用目的が変わっても銃を自己判断で保有し続けられる。","a":"×","why":"所持の許可は所有権と別。許可された用途・条件を守る必要があり、用途を追加するときは書換えが必要。","trap":"所有権と所持許可を混同","page":"1–2","topic":"所持者の責任","section":"S1","kind":"法令","bookPage":"第1編 第1章（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":2,"q":"許可を受けた猟銃が盗まれ犯罪に使用されないように管理することも、銃の所有者に期待される社会的責任に含まれる。","a":"○","why":"事故防止だけでなく、盗難・不正使用の防止も所持者の社会的責任。","trap":"直接の射撃事故以外にも責任","page":"1–2","topic":"所持者の責任","section":"S1","kind":"法令","bookPage":"第1編 第1章（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":3,"q":"猟銃の取扱いに自信がある者は、銃の危険性を正しく理解していれば、法令を詳しく学ぶ必要はない。","a":"×","why":"技術だけでは足りない。銃刀法等の法令に習熟する必要がある。","trap":"技術と法令の二者択一ではない","page":"1–2","topic":"所持者の責任","section":"S1","kind":"法令","bookPage":"第1編 第1章（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":4,"q":"銃に関する事故を起こさないという理念と、具体的な取扱規則の習得は、ともに所持者に求められる。","a":"○","why":"理念とルールを両方求めるのが公開例題の趣旨。","trap":"精神論だけ・知識だけの誤読","page":"1–2","topic":"所持者の責任","section":"S1","kind":"法令","bookPage":"第1編 第1章（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":5,"q":"事故を起こさなければ、所持許可に付された条件に違反しても公安委員会による処分の対象にならない。","a":"×","why":"実害の発生と無関係に、条件違反が取消事由になり得る。","trap":"結果が無害でも違反は成立","page":"1–2","topic":"所持者の責任","section":"S1","kind":"法令","bookPage":"第1編 第1章（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":6,"q":"空気銃は火薬を用いなくても銃刀法の所持規制の対象であり、危険性の理解と厳重な管理が必要である。","a":"○","why":"空気銃も銃規制の対象であり、人を傷つけ得る。","trap":"火薬を使わない＝自由ではない","page":"1–2","topic":"所持者の責任","section":"S1","kind":"法令","bookPage":"第1編 第1章（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":7,"q":"銃の事故はほぼ撃発機構の故障によって生じるため、使用者の操作の習熟は事故防止上重要ではない。","a":"×","why":"事故防止には構造の知識も操作練習も必要。","trap":"故障原因だけに限定するひっかけ","page":"1–2","topic":"所持者の責任","section":"S1","kind":"法令","bookPage":"第1編 第1章（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":8,"q":"猟銃等の所持許可は、一般的な所持の自由を認める制度ではなく、原則禁止に対する例外としての許可である。","a":"○","why":"銃砲の所持は原則禁止。公安委員会の許可等は例外。","trap":"原則禁止と例外許可","page":"1–2","topic":"所持者の責任","section":"S1","kind":"法令","bookPage":"第1編 第1章（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":9,"q":"自分の銃を修理店へ届けるためなら、所持許可のない家族が車で運搬しても、自分が依頼していれば適法である。","a":"×","why":"家族も運搬によって事実上の支配を持つ。許可や法定の例外なしに任せることはできない。","trap":"「運搬」も所持に含まれる","page":"2–8","topic":"所持許可・適格性","section":"S2","kind":"法令","bookPage":"第1編 第2章・所持許可制度（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":10,"q":"猟銃を発射していなくても、他人の銃を預かって自宅で保管することは「所持」に該当し得る。","a":"○","why":"所持には保管・携帯・運搬などが含まれる。","trap":"発射の有無は無関係","page":"2–8","topic":"所持許可・適格性","section":"S2","kind":"法令","bookPage":"第1編 第2章・所持許可制度（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":11,"q":"１丁の猟銃を夫婦で共同使用する場合には、一方が許可を受ければもう一方の名義を併記して所持できる。","a":"×","why":"１丁の銃を複数人で共同許可することはできない。","trap":"家族例外はない","page":"2–8","topic":"所持許可・適格性","section":"S2","kind":"法令","bookPage":"第1編 第2章・所持許可制度（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":12,"q":"既に散弾銃の許可を受けていても、別の散弾銃を追加取得する場合は、その銃について新たな許可が必要である。","a":"○","why":"銃ごとの所持許可が必要。","trap":"「同種類」でも銃ごと","page":"2–8","topic":"所持許可・適格性","section":"S2","kind":"法令","bookPage":"第1編 第2章・所持許可制度（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":13,"q":"所持許可の申請先は、銃を購入する銃砲店の所在地を管轄する警察署である。","a":"×","why":"所持許可申請は原則として本人の住所地を管轄する警察署。","trap":"購入先所在地と住所地","page":"2–8","topic":"所持許可・適格性","section":"S2","kind":"法令","bookPage":"第1編 第2章・所持許可制度（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":14,"q":"銃を購入する契約が済んでいても、所持許可証を受けるまで銃の譲渡を受けることはできない。","a":"○","why":"取得できるのは許可証交付後。","trap":"契約と占有・所持を区別","page":"2–8","topic":"所持許可・適格性","section":"S2","kind":"法令","bookPage":"第1編 第2章・所持許可制度（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":15,"q":"猟銃を譲り受けた後に14日以内の確認を行えば、譲受け前に所持許可を受けていなくても適法となる。","a":"×","why":"14日以内の確認は、許可を得て適法に譲受けた後の別手続。","trap":"許可前取得と譲受後確認","page":"2–8","topic":"所持許可・適格性","section":"S2","kind":"法令","bookPage":"第1編 第2章・所持許可制度（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":16,"q":"標的射撃のために所持許可を受ける場合でも、原則として指定射撃場を利用することが前提となる。","a":"○","why":"標的射撃用途は公安委員会が指定した射撃場で行う射撃。","trap":"標的ならどこでも良いわけではない","page":"2–8","topic":"所持許可・適格性","section":"S2","kind":"法令","bookPage":"第1編 第2章・所持許可制度（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":17,"q":"亡くなった親族の猟銃を形見として保管するだけなら、通常の猟銃所持許可の用途に当たる。","a":"×","why":"遺品の保管・収集は通常の許可用途に含まれない。","trap":"「使わないから安全」を誤用","page":"2–8","topic":"所持許可・適格性","section":"S2","kind":"法令","bookPage":"第1編 第2章・所持許可制度（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":18,"q":"「狩猟」の用途で許可を受けた猟銃を、法令上違法な狩猟に使用することは、用途に反しないから適法とはならない。","a":"○","why":"許可された用途であっても違法な狩猟には使用できない。","trap":"用途一致でも違法発射","page":"2–8","topic":"所持許可・適格性","section":"S2","kind":"法令","bookPage":"第1編 第2章・所持許可制度（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":19,"q":"空気銃と散弾銃は、所持許可を受けられる原則年齢がどちらも18歳以上である。","a":"×","why":"原則として猟銃は20歳以上、空気銃は18歳以上。","trap":"18歳と20歳の取り違え","page":"2–8","topic":"所持許可・適格性","section":"S2","kind":"法令","bookPage":"第1編 第2章・所持許可制度（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":20,"q":"銃の所持許可について、年齢の原則要件に例外が認められる制度があるため、「20歳未満はどんな場合も猟銃の許可を受けられない」とは言い切れない。","a":"○","why":"公開例題は「原則として20歳未満」としている。例外規定が存在する。","trap":"「原則」か「例外なく」か","page":"2–8","topic":"所持許可・適格性","section":"S2","kind":"法令","bookPage":"第1編 第2章・所持許可制度（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":21,"q":"猟銃の所持許可申請をした人は、法令上の欠格事由に該当しなければ、銃の構造上の危険があっても許可される。","a":"×","why":"人の欠格事由だけでなく銃自体の構造や機能も審査される。","trap":"人と銃の両方を審査","page":"2–8","topic":"所持許可・適格性","section":"S2","kind":"法令","bookPage":"第1編 第2章・所持許可制度（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":22,"q":"原則として、散弾銃の弾倉に３発以上の実包を装塡できる構造のものは所持許可の対象にならない。","a":"○","why":"規制対象は弾倉の装塡可能数。「銃全体で３発」と混同しない。","trap":"弾倉と薬室の区別","page":"2–8","topic":"所持許可・適格性","section":"S2","kind":"法令","bookPage":"第1編 第2章・所持許可制度（ページ確認中）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":23,"q":"弾倉に２発だけ入る散弾銃なら、消音装置が取り付けられていても所持許可の対象となる。","a": ction":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.51–55（携帯・運搬・発射）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":74,"q":"発射前の安全確認を怠ったが、人や物に損害が生じなかった場合には、危害防止上の注意義務違反は成立しない。","a":"×","why":"危害防止のための確認義務は実害がなくても問題となる。","trap":"被害の有無と違反成立","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.51–55（携帯・運搬・発射）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":75,"q":"射撃技能の維持向上は、猟銃所持者に課される努力義務であり、不履行が公安委員会の指示処分につながる場合がある。","a":"○","why":"「努力義務」だから全く処分と無関係というわけではない。","trap":"努力義務と指示処分","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.51–55（携帯・運搬・発射）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":76,"q":"複数丁の猟銃で狩猟する人は、そのうち１丁だけ練習しておけば、他の銃で初めて狩猟する前の練習努力義務を満たしたことになる。","a":"×","why":"狩猟に使用するそれぞれの銃について、狩猟期間ごとに事前練習に努める。","trap":"技能講習と練習努力義務の単位","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.51–55（携帯・運搬・発射）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":77,"q":"所持許可後に散弾銃の弾倉を３発以上入るものへ交換したときは、銃の構造・機能の基準維持義務に違反する。","a":"○","why":"許可を得た後も基準維持が必要。","trap":"申請時だけの規制ではない","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.51–55（携帯・運搬・発射）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":78,"q":"銃に不具合が出た場合でも、当面使用せず保管していれば、構造・機能の基準維持義務に違反することはない。","a":"×","why":"故障放置も基準維持義務に違反する場合がある。","trap":"未使用なら放置可とはならない","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.55–59（保管）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":79,"q":"銃の口径を大きくし別の銃と評価されるほど改造した場合、従来の許可が効力を失い不法所持になることがある。","a":"○","why":"改造により同一性を喪失すると、元の許可では足りない。","trap":"改造と単なる修理の区別","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.51–55（携帯・運搬・発射）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":80,"q":"ガンロッカーの鍵は、未成年の子供には渡せないが、配偶者に渡して管理させることは「自ら保管」に含まれる。","a":"×","why":"家族かどうかに関係なく、他人に鍵を預けていては自ら保管していると言えない。","trap":"家族例外の有無","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.55–59（保管）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":81,"q":"銃の保管を法定の猟銃等保管業者に委託した場合には、自ら保管する義務が免除される。","a":"○","why":"適法な保管委託は自ら保管の例外。","trap":"通常の知人への預け入れと別","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.55–59（保管）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":82,"q":"許可銃を知人宅へ一時的に預けても、知人の金庫が堅固で施錠可能なら、適法な保管委託となる。","a":"×","why":"法定の保管委託業者への委託と、一般人に預けることは別。","trap":"設備が良くても委託先が問題","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.55–59（保管）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":83,"q":"ガンロッカーには施錠機能だけでなく、金属製等の堅固さや容易に持ち運べない設置などの基準がある。","a":"○","why":"構造・施錠・設置場所・固定等を総合的に満たす。","trap":"鍵だけでよいわけではない","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.55–59（保管）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":84,"q":"ロッカー自体が重くて運搬困難なら、他人から見える玄関先に設置しても法定の保管基準には影響しない。","a":"×","why":"保管設備の設置場所には外から容易に見えない等の管理上の条件がある。","trap":"堅固さと設置場所は別","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.55–59（保管）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":85,"q":"許可銃の保管場所に関して、公安委員会が必要な報告を求めたり、法令に基づき警察職員が立入検査を行ったりする場合がある。","a":"○","why":"銃と実包の保管状況は法定の調査・検査対象。","trap":"本人の同意がなければ常に不可ではない","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.59–64（帳簿・検査等）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":86,"q":"ガンロッカーと実包保管設備を同一の部屋に置かないよう努めていれば、銃と実包を同一建物内に保管しない努力義務は必ず満たされる。","a":"×","why":"公開例題は「同一建物内に保管しないように努める」とする。部屋だけで判断しない。","trap":"部屋と建物の違い","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.55–59（保管）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":87,"q":"実包の管理帳簿には消費数量だけでなく、消費年月日、場所、使用した猟銃の許可番号等も記載する必要がある。","a":"○","why":"消費記録は数量だけでは不十分。","trap":"数量・日付・場所・銃番号","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.59–64（帳簿・検査等）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":88,"q":"標的射撃で消費した実包の帳簿には、射撃場名さえ書けば、射撃場の所在地は不要である。","a":"×","why":"射撃場の所在地と名称の双方を記載。","trap":"所在地を落とすひっかけ","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.59–64（帳簿・検査等）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":89,"q":"狩猟で使用した実包の消費場所は、隣接する村落名等またはメッシュ番号によって記録することができる。","a":"○","why":"狩猟では山野の場所を所定の形式で特定。","trap":"射撃場と狩猟地で書き方が異なる","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.51–55（携帯・運搬・発射）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":90,"q":"射撃場で消費した実包は帳簿への記載があれば足り、射票やレシートなどの裏付け資料は保存不要である。","a":"×","why":"消費数量を疎明する書類を添付し帳簿とともに保管する。","trap":"帳簿本体と添付資料","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.59–64（帳簿・検査等）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":91,"q":"実包の管理帳簿は最終記載の日から３年間保存し、その添付資料も検査時に示せるようにする必要がある。","a":"○","why":"保存は最後の記載から３年。","trap":"年始・取得日ではなく最終記載日","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.59–64（帳簿・検査等）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":92,"q":"実包帳簿の記載内容に変更がなくても、最初に帳簿を作った日から３年経てば廃棄してよい。","a":"×","why":"基準は最終記載日から３年間。","trap":"起算点のすり替え","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.59–64（帳簿・検査等）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":93,"q":"管理帳簿ではライフル実包の名称と、ライフル実包以外の番径を区別して記載する必要がある。","a":"○","why":"実包の種類によって必要な表示の区別がある。","trap":"名称と番径","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.59–64（帳簿・検査等）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":94,"q":"銃を家から射撃場へ運搬するときは、現物の所持許可証ではなく、その写しを携帯していれば法律上十分である。","a":"×","why":"所持許可証そのものの携帯が必要。","trap":"原本とコピー","page":"13–21","topic":"所持者の遵守事項","section":"S5","kind":"法令","bookPage":"第1編 第2章第6節 p.51–55（携帯・運搬・発射）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":95,"q":"猟銃・空気銃を紛失したときの届出は、捜索して発見できないことが確定してからではなく、直ちに行う必要がある。 :"○","why":"公開例題では狩猟等100個以下、標的射撃400個以下。","trap":"目的別の消費上限","page":"21–25","topic":"猟銃用火薬類","section":"S6","kind":"法令","bookPage":"第1編 第3章 p.83–86（製造・消費・廃棄）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":118,"q":"狩猟登録者の１日の実包消費について、無許可で消費できる上限は標的射撃と同じ400個である。","a":"×","why":"狩猟等で無許可消費できる数は合計100個以下。","trap":"標的射撃との混同","page":"21–25","topic":"猟銃用火薬類","section":"S6","kind":"法令","bookPage":"第1編 第3章 p.83–86（製造・消費・廃棄）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":119,"q":"猟銃用火薬類等の消費許可申請は、所持許可申請とは異なり、消費地を管轄する警察署へ提出する。","a":"○","why":"所持許可の住所地と消費許可の消費地は申請先が異なる。","trap":"住所地と消費地","page":"21–25","topic":"猟銃用火薬類","section":"S6","kind":"法令","bookPage":"第1編 第3章 p.83–86（製造・消費・廃棄）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":120,"q":"猟銃用火薬類を船舶で運搬するときは、公安委員会の譲受許可証があれば、船長の許可は不要となる。","a":"×","why":"船舶持込みには事前の船長の許可が必要。","trap":"譲受許可と運送手段の条件","page":"21–25","topic":"猟銃用火薬類","section":"S6","kind":"法令","bookPage":"第1編 第3章 p.83–85（運搬）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":121,"q":"猟銃用火薬類等を郵便で運ぶことは、包装が十分でも禁止されている。","a":"○","why":"郵便による運搬は全面禁止。","trap":"包装で禁止が解除されない","page":"21–25","topic":"猟銃用火薬類","section":"S6","kind":"法令","bookPage":"第1編 第3章 p.83–85（運搬）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":122,"q":"火薬類の消費許可がある場合、不要な残火薬は家庭ごみとして処理してもよい。","a":"×","why":"不要な火薬は所定の手続で譲渡・廃棄する。","trap":"消費許可と廃棄手続","page":"21–25","topic":"猟銃用火薬類","section":"S6","kind":"法令","bookPage":"第1編 第3章 p.83–86（製造・消費・廃棄）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":123,"q":"猟銃用火薬類の譲受許可証には、実際に譲り受けた日付と数量を販売側に記載してもらう必要がある。","a":"○","why":"譲受時の記載を受ける。","trap":"許可証を見せるだけで終わらない","page":"21–25","topic":"猟銃用火薬類","section":"S6","kind":"法令","bookPage":"第1編 第3章 p.74–83（譲受・所持・貯蔵）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":124,"q":"猟銃用火薬類無許可譲受票は、同一狩猟期間中なら申請のたびに何枚でも交付を受けられる。","a":"×","why":"一狩猟期間等につき１枚。","trap":"交付枚数を無制限と誤認","page":"21–25","topic":"猟銃用火薬類","section":"S6","kind":"法令","bookPage":"第1編 第3章 p.74–83（譲受・所持・貯蔵）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":125,"q":"火薬類の運搬方法には交通機関ごとに規制があり、飛行機では事前に航空会社へ確認が必要である。","a":"○","why":"火薬類の持込みは交通機関ごとに規制。","trap":"一律条件ではない","page":"21–25","topic":"猟銃用火薬類","section":"S6","kind":"法令","bookPage":"第1編 第3章 p.83–85（運搬）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":126,"q":"猟銃用火薬類の保管では、盗難対策だけできていれば、変質を防ぐための温度や湿度への配慮は不要である。","a":"×","why":"安全な場所での保管には変質・火気にも配慮が必要。","trap":"盗難防止と品質維持","page":"21–25","topic":"猟銃用火薬類","section":"S6","kind":"法令","bookPage":"第1編 第3章 p.74–83（譲受・所持・貯蔵）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":127,"q":"所持する実包やその譲受許可証を紛失・盗難した場合は、警察官等への届出が必要である。","a":"○","why":"実包現物だけでなく許可証の事故も届出対象。","trap":"現物と証書","page":"21–25","topic":"猟銃用火薬類","section":"S6","kind":"法令","bookPage":"第1編 第3章 p.74–83（譲受・所持・貯蔵）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":128,"q":"猟銃の所持許可証に「狩猟」と記載されていれば、狩猟免許や狩猟者登録はなくても狩猟を実施できる。","a":"×","why":"猟銃の所持許可と狩猟免許・登録は別の制度。","trap":"所持許可と狩猟資格","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第4章 p.88–93（狩猟法）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":129,"q":"狩猟者登録をしている場合でも、銃猟が禁止された区域や期間の規制を守らなければならない。","a":"○","why":"狩猟者登録が禁止場所や期間の例外を一律に作るわけではない。","trap":"登録で場所の制限は消えない","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第4章 p.88–93（狩猟法）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":130,"q":"銃猟の禁止場所で銃を発射しても、狩猟者登録があれば銃刀法上の発射制限とは無関係である。","a":"×","why":"違法な銃猟は鳥獣保護管理法だけでなく銃刀法上の違法発射となることがある。","trap":"二つの法律が関わる","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第4章 p.88–93（狩猟法）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":131,"q":"狩猟のための所持許可と、鳥獣捕獲許可に基づく有害鳥獣駆除では、活動の法的根拠が異なる。","a":"○","why":"「狩猟」「有害鳥獣駆除」は法令上区分。","trap":"同じ獣でも用途と許可の区別","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第4章 p.88–93（狩猟法）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":132,"q":"猟銃の所持許可があれば、狩猟目的でない捕獲も、鳥獣捕獲許可などの手続が常に不要となる。","a":"×","why":"銃の所持許可は鳥獣捕獲の許可とは別。","trap":"所持の許可と捕獲の許可","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第4章 p.88–93（狩猟法）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":133,"q":"年少射撃資格の認定制度は、通常の猟銃所持許可とは異なる手続として設けられている。","a":"○","why":"年少射撃の資格認定は所持許可と同義ではない。","trap":"射撃資格と銃の所持許可","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第2章第7節 p.64–73（年少射撃資格）","source":"読本の章立てと制度概要から構成。本文未照合","level":"上級"},{"id":134,"q":"年少射撃資格認定証の交付を受ければ、未成年者は自分の猟銃を一般の許可所持者と同じように自宅で自由に保管できる。","a":"×","why":"射撃資格と通常の猟銃所持許可・保管の権限は異なる。","trap":"資格証と所持・保管の権利","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第2章第7節 p.64–73（年少射撃資格）","source":"読本の章立てと制度概要から構成。本文未照合","level":"上級"},{"id":135,"q":"年少射撃資格の認定についても、認定要件や申請手続が別に定められている。","a":"○","why":"読本にも独立した章がある。","trap":"年少者なら誰でも自由ではない","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第2章第7節 p.64–73（年少射撃資格）","source":"読本の章立てと制度概要から構成。本文未照合","level":"上級"},{"id":136,"q":"年少射撃資格の認定を受ける制度は、通常の所持許可の年齢要件を満たさない者が一般的な狩猟を行うための無条件の例外である。","a":"×","why":"年少射撃資格の認定は所定の射撃活動を対象にした別制度。","trap":"標的射撃と一般狩猟","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第2章第7節 p.64–73（年少射撃資格）","source":"読本の章立てと制度概要から構成。本文未照合","level":"上級"},{"id":137,"q":"銃猟を始める前には、所持許可だけでなく、鳥獣保護管理法側で必要となる資格・登録・場所の規制を確認する必要がある。","a":"○","why":"許可の根拠が複数にまたがる。","trap":"１枚の許可証ですべて済まない","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第4章 p.88–93（狩猟法）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":138,"q":"年少射撃資格認定を受けた後は、認定の取消しや公安委員会による指示といった制度の対象にならない。","a":"×","why":"年少射撃資格にも指示・取消しの制度がある。","trap":"認定後の継続的な規制","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第2章第7節 p.64–73（年少射撃資格）","source":"読本の章立てと制度概要から構成。本文未照合","level":"上級"},{"id":139,"q":"読本の年少射撃資格の章では、認定の要件だけでなく認定後の手続、指示、取消しも学習対象となる。","a":"○","why":"目次に記載された独立項目。","trap":"申請だけ覚えても不十分","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第2章第7節 p.64–73（年少射撃資格）","source":"読本の章立てと制度概要から構成。本文未照合","level":"上級"},{"id":140,"q":"狩猟鳥獣に指定されている動物なら、捕獲場所や時期に関係なく銃による捕獲が許される。","a":"×","why":"狩猟鳥獣であっても期間・場所・猟法の規制がある。","trap":"鳥獣の種類だけでは決まらない","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第4章 p.88–93（狩猟法）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":141,"q":"狩猟に関する法令違反を伴う銃の発射は、許可銃による発射であっても行政処分の対象になり得る。","a":"○","why":"所持許可があっても発射行為そのものが違法になり得る。","trap":"合法な銃＝合法な発射ではない","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第4章 p.88–93（狩猟法）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":142,"q":"狩猟者登録は所持許可証と同じく銃１丁ごとに受けるため、猟銃の種類による免許区分は関係しない。","a":"×","why":"狩猟者登録と銃ごとの所持許可は異なる仕組み。","trap":"銃単位と狩猟登録","page":"25","topic":"狩猟法・年少射撃","section":"S7","kind":"法令","bookPage":"第1編 第4章 p.88–93（狩猟法）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":143,"q":"自動装塡式の散弾銃は、発射時のガス圧や反動を用いて次弾装塡を行うが、通常、引き金を１回引くだけで弾倉内の全弾を連続発射する構造ではない。","a":"○","why":"自動装塡と連続自動発射は別の概念。","trap":"「自動」の意味","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.103–109（撃発機構・安全装置）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":144,"q":"元折式散弾銃と自動装塡式散弾銃の分類は、弾丸が散るか単発で飛ぶかという弾道だけで区別される。","a":"×","why":"機構による分類と弾丸の種類・挙動は別。","trap":"銃の機構と弾種","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.97–103（銃の種類・機構）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":145,"q":"空気銃は、圧縮空気やガスで金属性弾丸を発射する銃であり、その方式には複数の種類がある。","a":"○","why":"火薬を使う装薬銃とは異なる。","trap":"エネルギー源と機構","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.97–103（銃の種類・機構）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":146,"q":"プリチャージ式空気銃は、発射の直前に実包の火薬を燃焼させ、圧縮空気を作り出す方式である。","a":"×","why":"プリチャージ式は予め圧縮した空気を貯めて利用する。","trap":"予圧と火薬","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.97–103（銃の種類・機構）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":147,"q":"撃発機構の「撃針」は雷管を打撃して起爆させる役割であり、「撃鉄」と機能を区別する。","a":"○","why":"撃鉄が撃針を打撃し、撃針が雷管を打撃する。","trap":"撃鉄→撃針→雷管","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.103–109（撃発機構・安全装置）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":148,"q":"逆鉤（シアー）は、雷管を直接打撃する部品であるため、撃針とは実質的に同じ役目を担う。","a":"×","why":"逆鉤は撃鉄の保持・解放に関わり、雷管打撃は撃針の役割。","trap":"逆鉤と撃針の混同","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.103–109（撃発機構・安全装置）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":149,"q":"安全装置を掛けた状態では通常の引き金操作で撃発しなくても、強い振動や衝撃による暴発を完全に防ぐものではない。","a":"○","why":"安全装置は万能ではない。","trap":"安全装置の守備範囲","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.103–109（撃発機構・安全装置）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":150,"q":"安全装置が正常に働いている銃なら、落下による衝撃でも撃発機構が動かないことが保証されている。","a":"×","why":"衝撃による暴発まで完全には防げない。","trap":"「保証される」を疑う","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.103–109（撃発機構・安全装置）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":151,"q":"猟銃の引き金の重さは、一般に狩猟用で２kg以上、射撃用で1.5kg以上が安全の目安とされている。","a":"○","why":"警察庁公開例題に示された安全目安。","trap":"狩猟用２／射撃用1.5","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.103–109（撃発機構・安全装置）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":152,"q":"引き金の安全目安は、狩猟用が1.5kg以上、射撃用が２kg以上であり、狩猟用の方が軽く設定されている。","a":"×","why":"公表例題の数値は逆。","trap":"1.5と２の入れ替え","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.103–109（撃発機構・安全装置）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":153,"q":"引き金の「遊び」は軽く動く範囲で、少なすぎると不意の作動を招くおそれがある。","a":"○","why":"引き金の遊びも暴発防止に関係する。","trap":"重さと遊びは別","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.103–109（撃発機構・安全装置）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":154,"q":"次射不能になった銃では、引き金を引いても絶対に発射できないので、銃口を安全な方向に向け続ける必要はない。","a":"×","why":"指の戻し不足などでは再び引き金を引くと発射する危険がある。","trap":"次射不能＝安全ではない","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.103–109（撃発機構・安全装置）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":155,"q":"次射不能の原因として、肩付けの不十分さと引き金を引く指の戻し不足が挙げられる。","a":"○","why":"公開例題ではこの２つが示される。","trap":"弾切れだけが原因ではない","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.103–109（撃発機構・安全装置）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":156,"q":"薬室が完全に閉鎖されていない状態でも、撃発するなら発射してよいが、銃身の清掃を後で行う必要がある。","a":"×","why":"不完全閉鎖では燃焼ガスが漏れ負傷するおそれがあるため発射してはならない。","trap":"発射可否と手入れのすり替え","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.103–109（撃発機構・安全装置）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":157,"q":"弾丸の飛び方だけを見て銃の威力を決めることはできず、口径と威力は必ずしも比例しない。","a":"○","why":"口径の大小と銃の威力は単純に比例しない。","trap":"口径が大きいほど必ず強い？","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.109–111（口径）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":158,"q":"散弾銃の番径は銃口直径をミリメートルで直接示す数値であり、20番は12番より口径が大きい。","a":"×","why":"番径は口径そのものの長さではない。通常12番の方が20番より内径が大きい。","trap":"番径数字の逆転","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.109–111（口径）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":159,"q":"ライフル実包の口径表示には複数の方式があるため、銃の表示と名称が似ているだけで適合する実包と判断してはならない。","a":"○","why":"使用する実包の適合性を確認する必要がある。","trap":"名称の類似では危険","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.109–111（口径）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":160,"q":"散弾銃用の実包は番径が同じなら銃身の長さなどを調べず、すべて同じ条件で使用できる。","a":"×","why":"番径だけでなく銃と使用する実包の適合性の確認が必要。","trap":"番径だけで判断","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.109–111（口径）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":161,"q":"空気銃の競技射撃においては、競技規則で使用できる口径が4.5mmと定められている例がある。","a":"○","why":"警察庁の例題では空気銃の標的射撃の口径として4.5mmを示す。","trap":"一般的口径と競技口径","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.109–111（口径）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":162,"q":"空気銃は通常5.5mm口径に統一されているため、4.5mm口径のものを使用することはない。","a":"×","why":"一般的な空気銃には4.5mmと5.5mmのものがある。","trap":"通常口径の複数性","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.109–111（口径）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":163,"q":"引き金の重さが軽すぎることも、極端に重すぎることも、事故や射撃の問題につながり得る。","a":"○","why":"軽すぎると暴発、重すぎると発射のタイミング等に影響。","trap":"軽さだけの問題ではない","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.103–109（撃発機構・安全装置）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":164,"q":"撃鉄と撃針が正常なら、薬室の閉鎖具合は安全性に影響せず、撃発前の確認は不要である。","a":"×","why":"薬室の不完全閉鎖は負傷事故につながる。","trap":"機構の正常と薬室閉鎖","page":"27–31","topic":"銃の種類・撃発機構","section":"S8","kind":"取扱い","bookPage":"第2編 第2章 p.103–109（撃発機構・安全装置）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":165,"q":"散弾の最大到達距離は、銃の番径そのものより使用する散弾の号数によって左右される。","a":"○","why":"散弾の号数による違いを理解する。","trap":"番径と号数","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":166,"q":"散弾銃の散弾の最大到達距離は、銃の番径が同じなら、散弾の号数が変わっても同一である。","a":"×","why":"散弾の号数によって最大到達距離が変わる。","trap":"号数差を無視","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":167,"q":"散弾銃用散弾の最大到達距離が約515mに及ぶ例があり、有効射程の外でも人に危険が及ぶ。","a":"○","why":"公開例題に約515mの値。最大到達距離と有効射程は別。","trap":"515mと有効射程","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":168,"q":"ライフルドスラッグは散弾銃で使う弾であるため、最大到達距離は散弾の約515mを必ず下回る。","a":"×","why":"ライフルドスラッグは約700mに及ぶ例がある。","trap":"散弾515mとスラッグ700m","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":169,"q":"ライフル銃の弾丸には最大到達距離が約4,000mに及ぶものがあり、見えている獲物の後方も確認対象となる。","a":"○","why":"最長到達の例が4,000m。","trap":"有効射程と最大到達距離","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":170,"q":"ライフル銃の弾丸は最大到達距離が銃の口径だけでほぼ決まるため、使用実包の種類は考えなくてよい。","a":"×","why":"主として使用実包の種類などで最大到達距離が変わる。","trap":"口径と実包の区別","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":171,"q":"追い風などの気象条件によって弾丸は通常より遠く飛ぶことがあるため、危険距離を固定的に考えるのは適切でない。","a":"○","why":"最大到達距離は条件でも変わる。","trap":"天候と飛翔距離","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":172,"q":"有効射程の外に出た弾丸には人を傷つける能力がないため、発射方向の安全確認は有効射程内だけでよい。","a":"×","why":"最大到達距離まで危険を考える。","trap":"有効射程≠危険の終わり","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":173,"q":"ライフル銃を使用する際、背後の地形などを利用するバックストップは、弾丸の飛び過ぎを防ぐうえで重要となる。","a":"○","why":"銃弾の最大到達距離を考慮し安全に弾を止める地形を利用。","trap":"狙点だけでなく背後","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":174,"q":"ライフル銃の弾丸が獲物に命中する見込みが高ければ、その背後に弾を止める地形がない場合でも撃って差し支えない。","a":"×","why":"命中率と弾の行き先は別。バックストップが重要。","trap":"命中可能性と安全性","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":175,"q":"散弾銃から発射される多数の散弾のうち、標的に命中しなかったものも広い範囲へ飛ぶ可能性がある。","a":"○","why":"散弾の散布範囲まで安全確認を行う。","trap":"命中弾以外の流れ弾","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":176,"q":"山の斜面に沿って撃ち下ろすときには、地面がバックストップになるので、必ず水平撃ちより安全である。","a":"×","why":"斜面への撃上げ・撃下ろしでも藪陰の人を直撃することがある。","trap":"斜面＝必ず安全ではない","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":177,"q":"水面、石垣、竹やぶなどに向けた発射では、跳弾が予測しにくい方向へ飛ぶ場合がある。","a":"○","why":"跳弾は方向を予測しにくい。","trap":"硬い石だけが跳弾原因ではない","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":178,"q":"水面での跳弾は金属性弾丸に限られ、散弾による発射では生じるおそれがない。","a":"×","why":"水面に向けた射撃も跳弾となる場合がある。","trap":"弾種で一律に除外しない","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":179,"q":"「見えていない所に人はいない」とは限らず、水平撃ちや斜面に沿った発射は思わぬ事故の原因になり得る。","a":"○","why":"藪陰などに人がいる可能性を考える。","trap":"見えない＝不存在ではない","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":180,"q":"危険範囲の確認はライフル銃を使用するときだけ必要で、空気銃では口径が小さいため不要である。","a":"×","why":"空気銃も危険があり、威力と危険範囲を知る必要がある。","trap":"空気銃を安全視","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":181,"q":"射撃場でも安全な発射方向をあらかじめ確認する必要があり、管理者の合図があっても周囲の安全確認は省略できない。","a":"○","why":"射撃場でも発射前の危害防止措置が必要。","trap":"射撃場を免責区域としない","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":182,"q":"弾丸の危険範囲は標的に届くかどうかの距離だけで判断し、散布範囲や跳弾を考慮する必要はない。","a":"×","why":"散弾の散布、跳弾、最大到達距離など多様な危険を考える。","trap":"危険を距離だけに限定","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":183,"q":"射撃の危険性を評価するときは、弾丸の威力と飛翔範囲を知ることが銃所持者自身の責任である。","a":"○","why":"所持者は自分が使う銃と弾の威力・到達距離を把握。","trap":"射撃場任せにしない","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":184,"q":"空気銃であれば人家のない方向に限らず、射撃前の安全確認を省いても銃刀法違反にならない。","a":"×","why":"空気銃でも発射前の安全確認が必要。","trap":"火薬使用の有無ではない","page":"31–33","topic":"弾丸の威力と危険範囲","section":"S9","kind":"取扱い","bookPage":"第2編 第2章第3節 p.109–115（威力と危険範囲）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":185,"q":"銃を手にしたとき、空と聞かされていても自分で薬室と弾倉の装塡状況を確認することが必要である。","a":"○","why":"他人の申告に頼らず、繰返し安全確認。","trap":"「空と言われた」だけでは不足","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第3章第1節 p.115–121（基本操作）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":186,"q":"銃身を取り外してあれば人に向けても構わないが、完成した銃では銃口を人へ向けてはならない。","a":"×","why":"分解して銃身だけのときも人方向に銃口を向けない。","trap":"分解時も銃口管理","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第3章第1節 p.115–121（基本操作）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":187,"q":"射撃中以外は原則として用心金の中へ指を入れないが、点検で空撃ちを行う等の特別な場合は例外がある。","a":"○","why":"公開例題は点検等の特別な場合も例示。","trap":"「絶対にどんな場合も」ではない","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第3章第2節 p.121–124（使用前の点検）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":188,"q":"猟場で獲物がいるかもしれない場所へ近づいたら、確認前でも指を用心金の中に入れて待つのが原則である。","a":"×","why":"獲物を確実に確認できた場合などを除き、用心金の中に指を入れない。","trap":"兆候と確実な確認","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第3章第1節 p.115–121（基本操作）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":189,"q":"猟銃を手から離すときは、機関部を開放し脱包したうえで、倒れない安定した場所に置く必要がある。","a":"○","why":"脱包と置き場所の両方が重要。","trap":"一つの措置で足りない","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第3章第1節 p.115–121（基本操作）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":190,"q":"猟場では実包を装塡する際、銃口を柔らかい地面に向けるのは危険なので、仲間の方向に向けた状態で装塡する。","a":"×","why":"銃口を人に向けることは絶対禁止。発射しても安全な方向を保つ。","trap":"銃口の向きは常に優先","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第3章第1節 p.115–121（基本操作）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":191,"q":"射撃場で射台に立っても、射撃開始の合図がなく発射準備ができていなければ、弾を装塡してはならない。","a":"○","why":"射台に立つだけで装塡が認められるわけではない。","trap":"射台の位置と開始合図","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第3章第1節 p.115–121（基本操作）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":192,"q":"自動装塡式散弾銃では、猟場で獲物の気配があれば弾倉を一杯にすることが推奨される。","a":"×","why":"装塡は射撃の状況に応じ必要最小限にとどめる。","trap":"装塡可能数＝推奨数ではない","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第3章第1節 p.115–121（基本操作）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":193,"q":"次射不能や不発が起きても、思わぬ発射の危険が残るため、銃口を安全な方向に向けて慎重に扱う。","a":"○","why":"次射不能と不発の取扱いでも安全な銃口管理が必要。","trap":"不発＝安全ではない","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第3章第1節 p.115–121（基本操作）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":194,"q":"遅発が疑われる場合は、直ちに機関部を開放して実包を抜くのが第一で、銃口を安全な方向に向けて保持して待つ必要はない。","a":"×","why":"警察庁例題では銃口を安全な方向に向け約10秒保持してから不発を判断する。","trap":"遅発時の保持時間","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第3章第1節 p.115–121（基本操作）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":195,"q":"銃腔に雪や木の葉が入っている可能性があるとき、発射せずに安全を確保して異物を確認する必要がある。","a":"○","why":"異物があれば銃身破裂につながる。","trap":"「発射で吹き飛ぶ」は危険","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第3章第2節 p.121–124（使用前の点検）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":196,"q":"薬室が空であれば安全装置の点検で引き金を引くときに銃口の向きを気にする必要はない。","a":"×","why":"空であっても銃口管理は必要。","trap":"脱包済みでも銃口方向","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第3章第2節 p.121–124（使用前の点検）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":197,"q":"宿泊先にガンロッカーがない場合でも、自宅保管に準じて施錠ケースを利用するなど盗難防止措置をとる必要がある。","a":"○","why":"宿泊時も厳正な管理が求められる。","trap":"宿泊先＝免除ではない","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第4章 p.128–129（実包運搬・保管）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":198,"q":"射撃場で食事をする短時間であれば、施錠した自動車のトランクは専用の銃保管設備として扱える。","a":"×","why":"車のトランクは専用の保管設備ではない。","trap":"「短時間」「施錠」でも不可","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第3章第3節 p.124–128（銃の保管）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":199,"q":"公共交通機関で実包を持ち運ぶとき、許可を持たない同行者に数量を分けて運ばせることはできない。","a":"○","why":"同行者に分けることは法的な所持・運搬の問題を生じる。","trap":"数量上限回避の分担","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第4章 p.128–129（実包運搬・保管）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"},{"id":200,"q":"猟銃とその銃に使用する実包は、別々の袋に入れれば同じ銃ケースの中に収納して運搬してよい。","a":"×","why":"猟銃と実包を同じケース内に入れて運搬してはならない。","trap":"別袋でも同一ケース不可","page":"33–43","topic":"基本操作・点検・保管","section":"S10","kind":"取扱い","bookPage":"第2編 第4章 p.128–129（実包運搬・保管）","source":"警察庁 令和7年11月28日 例題（内容を改変）","level":"上級"}];
Q=Q.concat(window.BONUS_QUESTIONS||[]);
var STORE='ryoju200-hard-v4';
var app=document.getElementById('app');
var DB={version:4,seen:{},miss:{},session:null,history:[],fxXp:0,fxTotalCorrect:0,fxSound:true,muscleFx:true};
var memOK=true,clock=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
function save(){try{localStorage.setItem(STORE,JSON.stringify(DB));memOK=true;}catch(e){memOK=false;}}
function load(){try{var d=JSON.parse(localStorage.getItem(STORE)||'null');if(d&&d.version===4&&d.seen&&d.miss){DB=d;memOK=true;}}catch(e){memOK=false;} if(!DB.history)DB.history=[];if(typeof DB.fxXp!=='number')DB.fxXp=0;if(typeof DB.fxTotalCorrect!=='number')DB.fxTotalCorrect=0;if(typeof DB.fxSound!=='boolean')DB.fxSound=true;if(typeof DB.muscleFx!=='boolean')DB.muscleFx=true;}
function mix(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),temp=a[i];a[i]=a[j];a[j]=temp;}return a;}
function idToQ(id){return Q[Number(id)-1];}
function getIDs(kind){return Q.filter(function(q){return QuizStore.available(DB,q)&&(kind==='法令'?q.kind==='法令':kind==='取扱い'?q.kind==='取扱い':kind&&kind.charAt(0)==='S'?q.section===kind:true);}).map(function(q){return q.id;});}
function remaining(s){return Math.max(0,3600-Math.floor((Date.now()-s.started)/1000));}
function mmss(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function countKeys(o){return Object.keys(o||{}).length;}
function sessionSummary(s){return s.mode==='exam'?'本番模試 50問':s.mode==='pack'?'🔓 PACK '+s.kind+'　50問':s.mode==='review'?'間違い復習':s.kind==='法令'?'法令だけ':s.kind==='取扱い'?'取扱いだけ':s.kind&&s.kind.charAt(0)==='S'?Q.find(function(x){return x.section===s.kind;}).topic:s.mode==='full'?'解放済み全問演習':'10問トレーニング';}
function notice(){return memOK?'':'<div class="warning">このブラウザーでは学習記録を保存できません。解答中は画面を閉じないでください。</div>';}
function finishSession(timeUp){var s=DB.session,priorMuscleStage=Muscle.stage(DB);if(!s||s.finished)return;s.finished=true;s.timeUp=!!timeUp;s.finishedAt=Date.now();var ids=s.order;var correct=0;ids.forEach(function(id){if(s.answers[id]===idToQ(id).a)correct++;});DB.history.unshift({date:Date.now(),mode:s.mode,total:ids.length,correct:correct});DB.history=DB.history.slice(0,20);if(s.mode==='exam'){DB.fxTotalCorrect+=correct;DB.fxXp+=10*correct;s.coinsEarned=QuizStore.examResult(DB,s,Q);}else{s.coinsEarned=s.coinsEarned||{};QuizStore.settle(DB,Q);}save();render();if(s.mode==='exam'&&correct>=45){window.requestAnimationFrame(function(){Reward.tone(20,DB.fxSound);Muscle.celebrate(DB,{exam:true,evolved:Muscle.stage(DB)>priorMuscleStage});});}else if(s.mode!=='exam'&&correct===ids.length&&ids.length>=10){window.requestAnimationFrame(function(){Muscle.celebrate(DB,{streak:correct,big:true,evolved:Muscle.stage(DB)>priorMuscleStage});});}}
function start(mode,kind){var ids=[];if(mode==='review'){ids=Object.keys(DB.miss).map(Number).filter(function(id){return idToQ(id)&&QuizStore.available(DB,idToQ(id));});}else if(mode==='pack'){ids=Q.filter(function(q){return q.pack===Number(kind)&&QuizStore.available(DB,q);}).map(function(q){return q.id;});}else if(mode==='exam'){ids=mix(getIDs('法令')).slice(0,25).concat(mix(getIDs('取扱い')).slice(0,25));}else if(mode==='full'){ids=getIDs('all');}else if(mode==='category'){ids=getIDs(kind);}else{ids=mix(getIDs('all')).slice(0,10);} if(!ids.length){render();return;}ids=mix(ids);DB.session={mode:mode,kind:kind||'全範囲',order:ids,index:0,answers:{},started:Date.now(),finished:false,timeUp:false,coinsEarned:{}};save();render();window.scrollTo(0,0);}
function answer(v){var s=DB.session;if(!s||s.finished)return;var id=s.order[s.index],first=!s.answers[id];if(s.mode!=='exam'&&!first)return;s.answers[id]=v;if(first)DB.seen[id]=(DB.seen[id]||0)+1;var ok=v===idToQ(id).a,streak=0,levelUp=0,muscleBefore=Muscle.stage(DB),muscleEvolved=false,celebrationPlan=null;
if(s.mode!=='exam'){if(!ok){DB.miss[id]=true;}else{delete DB.miss[id];if(first){streak=Reward.streak(s,idToQ);var oldLevel=Reward.level(DB.fxXp);DB.fxTotalCorrect++;DB.fxXp+=Reward.bonus(streak);if(Reward.level(DB.fxXp)>oldLevel)levelUp=Reward.level(DB.fxXp);Reward.tone(streak,DB.fxSound);}}var coins=QuizStore.onAttempt(DB,idToQ(id),ok);s.coinsEarned=s.coinsEarned||{};s.coinsEarned[id]=coins;QuizStore.settle(DB,Q);muscleEvolved=Muscle.stage(DB)>muscleBefore;if(ok&&first)celebrationPlan=Muscle.plan(DB,{streak:streak,evolved:muscleEvolved});}
save();render();if(s.mode!=='exam'){if(ok&&first)Muscle.celebrate(DB,{streak:streak,evolved:muscleEvolved,levelUp:levelUp,plan:celebrationPlan});window.requestAnimationFrame(function(){var f=app.querySelector('.feedback');if(f)f.scrollIntoView({behavior:'auto',block:'nearest'});});}}
function move(delta){var s=DB.session;if(!s||s.finished)return;var id=s.order[s.index];if(delta>0&&s.mode!=='exam'&&!s.answers[id])return;var n=s.index+delta;if(n<0||n>=s.order.length){if(n>=s.order.length)finishWithConfirm();return;}s.index=n;save();render();window.scrollTo(0,0);}
function finishWithConfirm(){var s=DB.session;if(!s||s.finished)return;var missing=s.order.filter(function(id){return !s.answers[id];}).length;if(missing&&s.mode==='exam'&&!window.confirm('未解答が'+missing+'問あります。採点しますか？'))return;finishSession(false);window.scrollTo(0,0);}
function home(){var s=DB.session;if(s&&!s.finished){if(!window.confirm('現在の解答を中断してトップへ戻りますか？ 続きから再開できます。'))return;}renderHome();window.scrollTo(0,0);}
function resetAndStart(mode,kind){var s=DB.session;if(s&&!s.finished&&countKeys(s.answers)&&!window.confirm('進行中のセッションを新しく開始しますか？ 現在の進捗は上書きされます。'))return;start(mode,kind);}
function renderHome(){var s=DB.session;var done=countKeys(DB.seen),miss=countKeys(DB.miss),unlocked=Q.filter(function(q){return QuizStore.available(DB,q);}).length;var resume=s&&!s.finished;var best=DB.history.filter(function(h){return h.mode==='exam'&&h.total===50;}).map(function(h){return h.correct;});
app.innerHTML=notice()+(resume?'<div class="continue"><div>📌 <b>学習の続き</b><p>'+esc(sessionSummary(s))+'：'+countKeys(s.answers)+' / '+s.order.length+'問</p></div><button class="btn" data-act="resume">再開する →</button></div>':'')+
'<div class="hero"><div class="herotitle"><h2>今日も一問ずつ、確実に。</h2><span class="pill">全600問 / 解放済み '+unlocked+'問</span></div><p class="desc">基礎200問＋上級400問の宝物庫。正解と復習でコインを獲得し、50問ずつ新しい問題を解放！読本復習ナビ付き。</p><div class="dash"><div class="metric"><div class="label">学習済み</div><strong>'+done+'<em> / '+unlocked+'</em></strong></div><div class="metric"><div class="label">復習待ち</div><strong>'+miss+'<em> 問</em></strong></div><div class="metric"><div class="label">模試最高</div><strong>'+(best.length?Math.max.apply(null,best):'―')+'<em>'+(best.length?' / 50':'')+'</em></strong></div></div></div>'+
Muscle.home(DB)+Muscle.collection(DB)+Reward.meta(DB)+Reward.soundButton(DB.fxSound)+'<a class="coin-jump" href="#coin-shop">🪙 新しい問題を解放する　<span>コインショップへ ↓</span></a><div class="modes"><button class="mode primary" data-act="start" data-mode="quick"><div class="modeicon">⚡</div><strong>10問だけ解く</strong><span class="small">○×直後に正解と解説<br>すきま時間におすすめ</span></button><button class="mode exam" data-act="start" data-mode="exam"><div class="modeicon">⏱</div><strong>50問 本番模試</strong><span class="small">60分・法令25問＋取扱い25問<br>最後にまとめて採点</span></button><button class="mode" data-act="start" data-mode="full"><div class="modeicon">📚</div><strong>解放済み全問</strong><span class="small">間違いも解説も全収録<br>途中で保存・再開可能</span></button><button class="mode" data-act="start" data-mode="review" '+(miss?'':'disabled')+'><div class="modeicon">🎯</div><strong>間違いだけ復習</strong><span class="small">現在 '+miss+'問を収録<br>解き直しで正解なら卒業</span></button></div>'+
'<section class="sections"><h3>読本の分野から選ぶ</h3><div class="smallmodes"><button data-act="start" data-mode="category" data-kind="法令">⚖️ 法令（解放済み）</button><button data-act="start" data-mode="category" data-kind="取扱い">🛡️ 取扱い・安全（解放済み）</button><button data-act="start" data-mode="category" data-kind="S1">所持者の責任</button><button data-act="start" data-mode="category" data-kind="S2">所持許可・適格性</button><button data-act="start" data-mode="category" data-kind="S3">更新・証明書</button><button data-act="start" data-mode="category" data-kind="S4">失効・取消し</button><button data-act="start" data-mode="category" data-kind="S5">所持者の遵守事項</button><button data-act="start" data-mode="category" data-kind="S6">猟銃用火薬類</button><button data-act="start" data-mode="category" data-kind="S7">狩猟法・年少射撃</button><button data-act="start" data-mode="category" data-kind="S8">銃の種類・撃発機構</button><button data-act="start" data-mode="category" data-kind="S9">弾丸の威力と危険範囲</button><button data-act="start" data-mode="category" data-kind="S10">基本操作・点検・保管</button></div><p class="note">間違った問題の解説に、読本の復習ページが表示されます。目次で確認できないページは未確認と明記しています。</p></section>'+
'<p class="help">本番は<strong>○×50問・60分・45点以上</strong>が合格基準。問題は警察庁の公表例題をもとに作成した独自の難問です。<b>読本の参照ページは提供された目次から推定したもので、本文全ページとの照合は未実施です。</b> 第1編の目次1ページ目が未撮影のため、序盤の正確なページは確認中です。</p>'+QuizStore.shop(DB,Q)+footer();}
function currentStreak(s){if(!s||s.mode==='exam')return 0;var idx=s.index;if(!s.answers[s.order[idx]])idx--;if(idx<0)return 0;return Reward.streak({mode:s.mode,order:s.order,answers:s.answers,index:idx},idToQ);}
function renderQuiz(){var s=DB.session,id=s.order[s.index],q=idToQ(id),v=s.answers[id],shown=(s.mode!=='exam'&&!!v),done=countKeys(s.answers),n=s.order.length,sec=s.mode==='exam'?remaining(s):null;
var box='<div class="topline"><button class="backbtn" data-act="home">← トップへ</button>'+(s.mode==='exam'?'<div id="countdown" class="timer '+(sec<300?'urgent':'')+'">⏱ '+mmss(sec)+'</div>':'<div class="timer">'+esc(sessionSummary(s))+'</div>')+'</div>';
box+='<div class="progress-head"><span>第 '+(s.index+1)+' 問 / '+n+' 問</span><span>回答済み '+done+'問</span></div><div class="meter"><span style="width:'+(100*done/n)+'%"></span></div>';
box+=Muscle.compact(DB);if(s.mode!=='exam')box+=Reward.hud(currentStreak(s),DB)+Reward.soundButton(DB.fxSound);box+='<article class="quizcard"><div class="qbody"><div class="qbadge"><span>'+esc(q.kind)+'　/　'+esc(q.topic)+'</span><b>問題ID '+q.id+'</b></div><div class="question">'+esc(q.q).replace(/\n/g,'<br>')+'</div><div class="hintline">正しい文章は「○」、誤っている文章は「×」</div><div class="answers">';
['○','×'].forEach(function(c){var klass=v===c?' selected':'';if(shown&&v===c&&v!==q.a)klass=' wrong';if(shown&&c===q.a)klass=' right';box+='<button type="button" '+(shown?'disabled ':'')+'data-act="answer" data-value="'+c+'" class="'+klass+'" aria-label="'+c+'を選ぶ" aria-pressed="'+(v===c)+'">'+c+'<small>'+(c==='○'?'正しい':'誤り')+'</small></button>';});box+='</div>';
if(shown){var ok=(v===q.a);box+='<section class="feedback" aria-live="polite">'+(ok?'<div class="muscle-inline-win"><span class="muscle-inline-icon">💪</span>ナイスマッチョ！ 体が強くなっていく！</div>'+Reward.panel(Reward.streak(s,idToQ))+'<div class="coin-earned">'+((s.coinsEarned&&s.coinsEarned[id])?'🪙 +'+s.coinsEarned[id]+' C 獲得！':'🪙 この問題の学習コインは獲得済み')+'</div>':'')+'<div class="verdict '+(ok?'good':'bad')+'">'+(ok?'✓ 正解！':'✕ 不正解　正解は '+q.a)+'</div><div class="exlabel">解説</div><div class="explanation">'+esc(q.why)+'</div><div class="trap"><b>⚠ 迷わせるポイント</b>'+esc(q.trap)+'</div><div class="bookref"><b>📖 読本の復習先</b><div>'+esc(q.bookPage)+'</div><small>提供された目次からの案内。本文全ページとの照合は未実施。</small></div><div class="source">'+esc(q.source)+'　｜ 公開例題の関連箇所 p.'+esc(q.page)+'<br><a target="_blank" rel="noopener noreferrer" href="https://www.npa.go.jp/laws/notification/seian/hoan/hoantsutatu2/R071128_jyu_kousanojishi.pdf">警察庁の例題（PDF）を開く ↗</a></div></section>';}
var atEnd=s.index===n-1;box+='<div class="controls">'+(s.mode==='exam'&&s.index>0?'<button class="btn prev ghost" data-act="prev">← 戻る</button>':'')+'<button class="btn next" data-act="'+(atEnd?'finish':'next')+'" '+(s.mode!=='exam'&&!v?'disabled':'')+'>'+(atEnd?'採点結果を見る →':'次の問題へ →')+'</button></div>';
if(s.mode==='exam')box+='<div class="note">模試中は正解を表示しません。前の問題に戻って解答を変更できます。途中再開しても制限時間は進みます。</div>';else box+='<div class="note">回答直後に解説が表示されます。復習モードで正解すると、復習待ちリストから外れます。</div>';
box+='</div></article>'+footer();app.innerHTML=box;}
function renderResult(){var s=DB.session,correct=0,wrong=[];s.order.forEach(function(id){var q=idToQ(id),v=s.answers[id];if(v===q.a){correct++;}else{wrong.push({q:q,v:v||'未回答'});DB.miss[id]=true;}});save();var total=s.order.length,rate=Math.round(100*correct/total),full=s.mode==='exam',pass=full&&correct>=45;
var out='<div class="topline"><button class="backbtn" data-act="home">← トップへ</button><span class="pill">学習結果</span></div><section class="result"><div style="font-size:40px;margin-bottom:7px">'+(pass?'🏅':wrong.length?'📖':'🌟')+'</div><h2>'+(full?'本番模試の結果':'学習おつかれさま！')+'</h2><div class="score">'+correct+'<small> / '+total+'問</small></div>'+(full?'<div class="'+(pass?'pass':'fail')+'">'+(pass?'合格ライン到達！':'合格まであと'+(45-correct)+'問')+'</div>':'<div class="pass">正答率 '+rate+'%</div>')+'<p>'+(s.timeUp?'60分が経過したため自動採点しました。<br>':'')+(s.mode==='exam'?'🪙 今回獲得したコイン '+(s.coinsEarned||0)+' C<br>':'')+'正答率 '+rate+'%　/　不正解・未回答 '+wrong.length+'問</p><div class="resultactions"><button class="btn" data-act="home">メニューに戻る</button><button class="btn outline" data-act="start" data-mode="review" '+(countKeys(DB.miss)?'':'disabled')+'>間違いを復習</button></div><h3 class="titleleft">'+(wrong.length?'間違えた問題と解説（'+wrong.length+'問）':'全問正解です！')+'</h3>';
var groups={};wrong.forEach(function(w){var k=w.q.bookPage; if(!groups[k])groups[k]={count:0,title:w.q.topic};groups[k].count++;});var ranked=Object.keys(groups).sort(function(a,b){return groups[b].count-groups[a].count;});if(ranked.length){out+='<section class="revision"><h3>📖 あなたの復習ページ</h3><p>間違いが多かった分野から読本を読み直してください。</p>';ranked.forEach(function(k){out+='<div class="revision-item"><strong>'+esc(groups[k].title)+' （'+groups[k].count+'問）</strong><span>'+esc(k)+'</span></div>';});out+='</section>'; }
wrong.forEach(function(row){out+='<div class="review-row"><div class="wrong-num">ID '+row.q.id+' ｜ あなた '+esc(row.v)+' ｜ 正解 '+row.q.a+'</div><h4>'+esc(row.q.q)+'</h4><p><b>解説：</b>'+esc(row.q.why)+'</p><p><b>ひっかけ：</b>'+esc(row.q.trap)+'</p></div>';});out+='</section>'+footer();app.innerHTML=out;}
function footer(){return '<footer class="footer">参考：警察庁「<a href="https://www.npa.go.jp/laws/notification/seian/hoan/hoantsutatu2/R071128_jyu_kousanojishi.pdf" rel="noopener noreferrer" target="_blank">猟銃等又はクロスボウ講習会における考査の運用要領</a>」（令和7年11月28日）、別添1・別添3。本アプリは警察庁の公式アプリではありません。<br>法令確認：<a href="https://laws.e-gov.go.jp/law/333AC0000000006" target="_blank" rel="noopener noreferrer">e-Gov 銃砲刀剣類所持等取締法</a>・<a href="https://laws.e-gov.go.jp/law/333CO0000000033" target="_blank" rel="noopener noreferrer">同施行令</a>（2026年10月確認）。問題文・解説は自主学習用の独自編集で、追加400問は公式例題にある知識を組み合わせた応用問題です。公式問題の丸写しではありません。読本本文は未提供のため復習ページは暫定です。インターネット接続は初回のアプリ表示時に必要です。<br>記録は使用中のブラウザー内にのみ保存されます。'+(memOK?'':'<b>この環境では記録の永続保存は利用できません。</b>')+'</footer>';}
function render(){var s=DB.session;if(s&&!s.finished&&s.mode==='exam'&&remaining(s)<=0){finishSession(true);return;}if(!s){renderHome();return;}if(s.finished){renderResult();return;}renderQuiz();}
app.addEventListener('click',function(e){var b=e.target.closest('button[data-act]');if(!b||b.disabled)return;var action=b.getAttribute('data-act');if(action==='pack-start'){resetAndStart('pack',Number(b.getAttribute('data-pack')));return;}if(action==='pack-buy'){var pack=Number(b.getAttribute('data-pack')),out=QuizStore.buy(DB,Q,pack);if(!out.ok){window.alert(out.message);return;}save();renderHome();window.requestAnimationFrame(function(){var e=document.getElementById('coin-shop');if(e)e.scrollIntoView({behavior:'auto',block:'start'});Reward.tone(20,DB.fxSound);Muscle.celebrate(DB,{pack:pack});});return;}if(action==='start'){resetAndStart(b.getAttribute('data-mode'),b.getAttribute('data-kind'));return;}if(action==='home'){home();return;}if(action==='resume'){render();return;}if(action==='muscle-toggle'){DB.muscleFx=!DB.muscleFx;save();renderHome();return;}if(action==='reward-sound'){DB.fxSound=!DB.fxSound;save();render();return;}if(action==='answer'){answer(b.getAttribute('data-value'));return;}if(action==='next'){move(1);return;}if(action==='prev'){move(-1);return;}if(action==='finish'){finishWithConfirm();return;}});
load();QuizStore.ensure(DB,Q);save();if(DB.session&&DB.session.finished){DB.session=null;save();}renderHome();
clock=setInterval(function(){var s=DB.session;if(!s||s.finished||s.mode!=='exam')return;if(remaining(s)<=0){finishSession(true);return;}var t=document.getElementById('countdown');if(t){t.textContent='⏱ '+mmss(remaining(s));t.classList.toggle('urgent',remaining(s)<300);}},1000);
window.addEventListener('visibilitychange',function(){if(!document.hidden&&DB.session&&!DB.session.finished&&DB.session.mode==='exam')render();});
})();
</script></body></html>
